[project]
name = "repo3"
version = "0.1.0"
description = "GEOS agent evaluation harness (repo3)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.100.0",
    "boto3>=1.43.4",
    "botocore>=1.43.4",
    "faiss-cpu>=1.13.2",
    "fastmcp>=3.2.4",
    "langchain>=1.2.17",
    "langchain-anthropic>=1.4.3",
    "langchain-aws>=1.4.6",
    "langchain-community>=0.4.1",
    "langchain-core>=1.3.3",
    "langchain-huggingface>=1.2.2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.2.1",
    "langgraph>=1.1.10",
    "lxml>=5.0.0",
    "openai>=2.0.0",
    "pydantic>=2.13.3",
    "python-dotenv>=1.0.0",
    "pyvista>=0.48.0",
    "requests>=2.33.1",
    "sentence-transformers>=5.4.1",
    "tiktoken>=0.12.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
]
